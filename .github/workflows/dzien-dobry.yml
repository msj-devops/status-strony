# Pierwszy workflow: przywitanie i informacje o runnerze przy każdym Pull Requeście.
name: Dzień dobry

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powitanie:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Przywitaj się
        run: echo "Dzień dobry! Tu runner GitHuba, sprawdzam repozytorium status-strony."

      - name: Pokaż, na czym działam
        run: |
          echo "System:"; uname -a
          echo "Procesory: $(nproc)"
          echo "Użytkownik: $(whoami)"
          echo "Katalog roboczy: $(pwd)"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Pokaż zawartość repozytorium
        run: ls -la healthcheck chart wdrozenia
