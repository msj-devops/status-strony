# Tymczasowy eksperyment (Moduł 02): co z jobem zbiorczym z !cancelled(), gdy przebieg anulowano.
name: Eksperyment anulowanie

on:
  pull_request:

permissions:
  contents: read

jobs:
  dlugi:
    name: Długi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - run: sleep 240

  werdykt-nie-anulowany:
    name: Werdykt z !cancelled()
    needs: dlugi
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "wyniki ${{ needs.dlugi.result }}"; test "${{ needs.dlugi.result }}" = success

  werdykt-zawsze:
    name: Werdykt z always()
    needs: dlugi
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "wyniki ${{ needs.dlugi.result }}"; test "${{ needs.dlugi.result }}" = success
