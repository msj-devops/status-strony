# Tymczasowy eksperyment (Moduł 02): job zbiorczy bez warunku, gdy job, od którego zależy, się nie udał.
name: Eksperyment anulowanie

on:
  pull_request:

permissions:
  contents: read

jobs:
  testy:
    name: Testy eksperymentu
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: exit 1

  werdykt-bez-warunku:
    name: Werdykt bez warunku
    needs: testy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "tu nie dojdziemy"
