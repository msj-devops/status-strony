# CD: po każdym scaleniu do main obraz healthcheck trafia do GitHub Container Registry
# dla amd64 i arm64, z tagiem równym pełnemu SHA commita.
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# wdrożenia idą jedno po drugim; nowsze scalenie nie przerywa wdrożenia w toku
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  # nazwa obrazu małymi literami (GHCR nie przyjmuje wielkich liter)
  OBRAZ: ghcr.io/msj-devops/healthcheck

jobs:
  obraz:
    name: Obraz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Przygotuj QEMU (budowanie dla arm64 na runnerze amd64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Przygotuj buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Zaloguj do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagi i etykiety obrazu
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.OBRAZ }}
          tags: |
            type=sha,format=long,prefix=

      - name: Zbuduj i opublikuj obraz
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: healthcheck
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
