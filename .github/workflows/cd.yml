# CD: po każdym scaleniu do main obraz healthcheck trafia do GitHub Container Registry
# dla amd64 i arm64, z tagiem równym pełnemu SHA commita.
name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# wdrożenia idą jedno po drugim; nowsze scalenie nie przerywa wdrożenia w toku
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  # nazwa obrazu małymi literami (GHCR nie przyjmuje wielkich liter)
  OBRAZ: ghcr.io/msj-devops/healthcheck

jobs:
  obraz:
    name: Obraz
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Przygotuj QEMU (budowanie dla arm64 na runnerze amd64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Przygotuj buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Zaloguj do GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagi i etykiety obrazu
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.OBRAZ }}
          tags: |
            type=sha,format=long,prefix=

      - name: Zbuduj i opublikuj obraz
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: healthcheck
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  kind:
    name: Próba w kind
    needs: obraz
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PRZESTRZEN: f2-dev
      RELEASE: strona-dev
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Przygotuj Helma
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Utwórz klaster kind (Kubernetes jak w minikube)
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          cluster_name: proba

      - name: Klaster próbny
        run: kubectl get nodes,storageclass -o wide

      - name: Przygotuj przestrzeń nazw i Secret panelu (hasło tylko na próbę)
        run: |
          kubectl create namespace "$PRZESTRZEN"
          kubectl -n "$PRZESTRZEN" create secret generic strona-htpasswd \
            --from-literal=htpasswd="proba:$(openssl passwd -apr1 "$(openssl rand -hex 12)")"

      - name: Zainstaluj chart z obrazem tego commita
        run: |
          helm upgrade --install "$RELEASE" chart/status-strony -n "$PRZESTRZEN" \
            -f wdrozenia/dev/values.yaml \
            --set healthcheck.image.tag="$GITHUB_SHA" \
            --wait --timeout 5m

      - name: "Test dymny: healthcheck z nowego obrazu w klastrze"
        run: |
          kubectl -n "$PRZESTRZEN" create job test-dymny --from="cronjob/$RELEASE-healthcheck"
          if ! kubectl -n "$PRZESTRZEN" wait --for=condition=complete job/test-dymny --timeout=120s; then
            kubectl -n "$PRZESTRZEN" logs job/test-dymny || true
            exit 1
          fi
          kubectl -n "$PRZESTRZEN" logs job/test-dymny

      - name: "Test dymny: strona i panel odpowiadają"
        run: |
          kubectl -n "$PRZESTRZEN" port-forward "service/$RELEASE-strona" 8080:80 >/dev/null 2>&1 &
          for _ in $(seq 1 15); do curl -fsS -o /dev/null http://127.0.0.1:8080/ && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q msj-devops
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/admin/)" = 401
          echo "Strona: 200 z loginem, panel: 401"

      - name: Co jest w klastrze (po błędzie)
        if: failure()
        run: |
          kubectl -n "$PRZESTRZEN" get all,ingress,pvc
          kubectl -n "$PRZESTRZEN" get events --sort-by=.lastTimestamp | tail -n 30

  dev:
    name: Wdrożenie na dev
    needs: kind
    # runner w VM: tylko on widzi klaster minikube. Ten workflow rusza wyłącznie po pushu do main,
    # nigdy przy Pull Requeście, więc na runnerze w VM nie wykona się kod spoza main.
    runs-on: [self-hosted, minikube]
    # środowisko dev: historia wdrożeń w GitHubie z adresem strony (zmienna środowiska ADRES_STRONY);
    # wdrażać do niego wolno tylko z main, a jego sekret PANEL_HASLO dostaje tylko ten job
    environment:
      name: dev
      url: ${{ vars.ADRES_STRONY }}
    timeout-minutes: 10
    env:
      PRZESTRZEN: f2-dev
      RELEASE: strona-dev
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hasło do panelu z sekretu środowiska dev → Secret strona-htpasswd
        env:
          PANEL_LOGIN: ${{ vars.PANEL_LOGIN }}
          PANEL_HASLO: ${{ secrets.PANEL_HASLO }}
        run: |
          if [ -z "$PANEL_LOGIN" ] || [ -z "$PANEL_HASLO" ]; then
            echo "::error::Brak zmiennej PANEL_LOGIN albo sekretu PANEL_HASLO w środowisku dev (Settings → Environments → dev)"
            exit 1
          fi
          # hasło na wejście openssl (nie jako argument: argumenty procesów widać w ps)
          skrot="$(printf '%s' "$PANEL_HASLO" | openssl passwd -apr1 -stdin)"
          # skrót wyliczył job, więc GitHub nie wie, że to sekret: maskujemy go sami
          echo "::add-mask::$skrot"
          # utwórz albo zaktualizuj Secret; manifest (z hasłem w base64) tylko w potoku, nigdzie nie wypisany
          printf '%s:%s\n' "$PANEL_LOGIN" "$skrot" \
            | kubectl -n "$PRZESTRZEN" create secret generic strona-htpasswd --from-file=htpasswd=/dev/stdin \
                --dry-run=client -o yaml \
            | kubectl -n "$PRZESTRZEN" apply -f -

      - name: Wdróż chart z obrazem tego commita (przy błędzie Helm wraca do poprzedniej wersji)
        run: |
          helm upgrade --install "$RELEASE" chart/status-strony -n "$PRZESTRZEN" \
            -f wdrozenia/dev/values.yaml \
            --set healthcheck.image.tag="$GITHUB_SHA" \
            --rollback-on-failure --timeout 5m
          helm history "$RELEASE" -n "$PRZESTRZEN" --max 3

      - name: "Test dymny: healthcheck z nowego obrazu w f2-dev"
        env:
          JOB: test-dymny-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          kubectl -n "$PRZESTRZEN" create job "$JOB" --from="cronjob/$RELEASE-healthcheck"
          wynik=0
          kubectl -n "$PRZESTRZEN" wait --for=condition=complete "job/$JOB" --timeout=120s || wynik=1
          kubectl -n "$PRZESTRZEN" logs "job/$JOB" || true
          kubectl -n "$PRZESTRZEN" delete job "$JOB" --wait=false
          exit "$wynik"
