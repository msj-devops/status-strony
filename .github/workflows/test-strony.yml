# Test strony: strona wyrenderowana z chartu (wartości dev) w nginx na runnerach amd64 i arm64, healthcheck i raport.
name: Test strony

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strona:
    name: Strona (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Przygotuj Pythona
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: healthcheck/requirements.txt

      - name: Zainstaluj zależności healthchecka
        run: pip install -r healthcheck/requirements.txt

      - name: Przygotuj Helma
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Wyrenderuj stronę z chartu (wartości dev)
        run: |
          set -o pipefail
          strona="$RUNNER_TEMP/strona"
          mkdir -p "$strona/html/admin" "$strona/nginx"
          helm template strona-dev chart/status-strony -n f2-dev -f wdrozenia/dev/values.yaml \
            --show-only templates/configmap-strona.yaml > "$RUNNER_TEMP/configmap-strona.yaml"
          yq '.data["index.html"]' "$RUNNER_TEMP/configmap-strona.yaml" > "$strona/html/index.html"
          yq '.data["admin.html"]' "$RUNNER_TEMP/configmap-strona.yaml" > "$strona/html/admin/index.html"
          yq '.data["default.conf"]' "$RUNNER_TEMP/configmap-strona.yaml" > "$strona/nginx/default.conf"
          # ten sam obraz nginx, który wdraża chart
          obraz="$(helm template strona-dev chart/status-strony -n f2-dev -f wdrozenia/dev/values.yaml \
            --show-only templates/deployment-strona.yaml | yq '.spec.template.spec.containers[0].image')"
          echo "OBRAZ_NGINX=$obraz" >> "$GITHUB_ENV"
          echo "Obraz nginx z chartu: $obraz"

      - name: Uruchom stronę w nginx
        run: |
          mkdir -p "$RUNNER_TEMP/hasla"
          # konto tylko na czas testu, z losowym hasłem: panel ma żądać logowania
          printf 'ci:%s\n' "$(openssl passwd -apr1 "$(openssl rand -hex 16)")" > "$RUNNER_TEMP/hasla/htpasswd"
          chmod 644 "$RUNNER_TEMP/hasla/htpasswd"
          docker run -d --name strona -p 8080:80 \
            -v "$RUNNER_TEMP/strona/html:/usr/share/nginx/html:ro" \
            -v "$RUNNER_TEMP/strona/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/hasla:/etc/nginx/hasla:ro" \
            "$OBRAZ_NGINX"
          curl --silent --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8080/

      - name: Sprawdź stronę healthcheckiem
        run: python healthcheck/healthcheck.py healthcheck/cele-ci.yaml --raport "raport-${{ runner.arch }}.json"

      - name: Pokaż logi nginx
        if: failure()
        run: docker logs strona

      - name: Zapisz raport jako artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raport-${{ runner.arch }}
          path: raport-${{ runner.arch }}.json
          if-no-files-found: error
          retention-days: 14

  podsumowanie:
    needs: strona
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pobierz raporty
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: raport-*
          merge-multiple: true

      - name: Zapisz podsumowanie
        run: |
          {
            echo "## Test strony"
            echo
            echo "Wynik jobów strony: **${{ needs.strona.result }}**"
            echo
            echo "| Raport | Adres | Status | Czas [ms] | Wynik |"
            echo "|---|---|---|---|---|"
            # shellcheck disable=SC2016  # $r to zmienna jq, nie powłoki
            wiersz='.[] | "| \($r) | \(.url) | \(.status // "-") | \(.czas_ms) | \(if .ok then "OK" else "BŁĄD" end) |"'
            for plik in raport-*.json; do
              jq -r --arg r "$plik" "$wiersz" "$plik"
            done
          } >> "$GITHUB_STEP_SUMMARY"
