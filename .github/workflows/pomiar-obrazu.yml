# Pomiar (do usunięcia): czas budowania obrazu healthcheck na dwie architektury, bez cache i bez publikacji.
name: Pomiar obrazu

on:
  pull_request:

permissions:
  contents: read

jobs:
  qemu:
    name: QEMU (amd64+arm64 na jednym runnerze)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Zbuduj
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: healthcheck
          platforms: linux/amd64,linux/arm64
          push: false

  qemu-arm:
    name: QEMU (tylko arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Zbuduj
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: healthcheck
          platforms: linux/arm64
          push: false

  natywnie:
    name: Natywnie (${{ matrix.runner }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            platforma: linux/amd64
          - runner: ubuntu-24.04-arm
            platforma: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Zbuduj
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: healthcheck
          platforms: ${{ matrix.platforma }}
          push: false
