# Nocny healthcheck: co noc sprawdza publiczne adresy projektu i zostawia raport jako artefakt.
name: Nocny healthcheck

on:
  schedule:
    # 2:17 UTC = 3:17 czasu zimowego i 4:17 letniego w Polsce; nie o pełnej godzinie, bo wtedy GitHub ma największy ruch
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Przygotuj Pythona
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: healthcheck/requirements.txt

      - name: Zainstaluj zależności healthchecka
        run: pip install -r healthcheck/requirements.txt

      - name: Sprawdź publiczne adresy
        run: python healthcheck/healthcheck.py healthcheck/cele-publiczne.yaml --timeout 10 --raport raport-nocny.json

      - name: Zapisz raport jako artefakt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raport-nocny-${{ github.run_number }}
          path: raport-nocny.json
          if-no-files-found: error
          retention-days: 7
