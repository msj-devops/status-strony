apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-strony.fullname" . }}-healthcheck-cele
  labels:
    {{- include "status-strony.labels" . | nindent 4 }}
    app.kubernetes.io/component: healthcheck
data:
  cele.yaml: |
    cele:
      # strona i panel tego release'u: nazwa usługi zależy od nazwy release'u, więc wylicza ją szablon
      - url: http://{{ include "status-strony.fullname" . }}-strona/
        oczekiwany_status: 200
      - url: http://{{ include "status-strony.fullname" . }}-strona/admin/
        oczekiwany_status: 401
      {{- range .Values.healthcheck.cele }}
      - url: {{ .url | quote }}
        oczekiwany_status: {{ .oczekiwany_status }}
      {{- end }}
