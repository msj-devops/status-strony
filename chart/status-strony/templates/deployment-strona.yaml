apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "status-strony.fullname" . }}-strona
  labels:
    {{- include "status-strony.labels" . | nindent 4 }}
    app.kubernetes.io/component: strona
spec:
  replicas: {{ .Values.strona.replicas }}
  selector:
    matchLabels:
      {{- include "status-strony.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: strona
  template:
    metadata:
      labels:
        {{- include "status-strony.labels" . | nindent 8 }}
        app.kubernetes.io/component: strona
      annotations:
        # zmiana treści albo konfiguracji strony zmienia szablon Poda, więc Deployment robi rollout
        checksum/konfiguracja: {{ include (print $.Template.BasePath "/configmap-strona.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.strona.image.repository }}:{{ .Values.strona.image.tag }}"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            {{- toYaml .Values.strona.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: konfiguracja-nginx
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: hasla
              mountPath: /etc/nginx/hasla
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: {{ include "status-strony.fullname" . }}-strona
            items:
              - key: index.html
                path: index.html
              - key: admin.html
                path: admin/index.html
        - name: konfiguracja-nginx
          configMap:
            name: {{ include "status-strony.fullname" . }}-strona
            items:
              - key: default.conf
                path: default.conf
        - name: hasla
          secret:
            secretName: {{ .Values.admin.existingSecret | quote }}
