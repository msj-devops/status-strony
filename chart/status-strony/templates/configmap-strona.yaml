{{- /* jedno źródło treści strony: pliki w files/ (wyrażenia Helma w nich wypełnia tpl) */ -}}
{{- $_ := required "Brak loginu: ustaw wartość login (np. w values-dev.yaml albo --set login=...)" .Values.login -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "status-strony.fullname" . }}-strona
  labels:
    {{- include "status-strony.labels" . | nindent 4 }}
    app.kubernetes.io/component: strona
data:
  index.html: |
    {{- tpl (.Files.Get "files/html/index.html") . | trim | nindent 4 }}
  admin.html: |
    {{- tpl (.Files.Get "files/html/admin/index.html") . | trim | nindent 4 }}
  default.conf: |
    {{- tpl (.Files.Get "files/nginx/default.conf") . | trim | nindent 4 }}
