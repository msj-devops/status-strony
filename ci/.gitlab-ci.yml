# CI status-strony w GitLab CI/CD: przekład .github/workflows/ci.yml (zadanie 05.1).
# Plik tylko do przeglądu i walidacji: projekt nie ma konta na GitLabie.
#
# Co zniknęło przy przekładzie:
# - job "Zmiany": GitLab sam porównuje pliki merge requesta z gałęzią docelową (rules:changes),
# - job zbiorczy "CI OK": w GitLabie merge request blokuje ustawienie projektu
#   "Pipelines must succeed", które patrzy na cały pipeline, a nie na wybrane joby.
# - lint workflow GitHub Actions (actionlint): sprawdza pliki innego narzędzia; zostaje w GitHubie.

workflow:
  rules:
    # odpowiednik on: pull_request
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # odpowiednik on: push: branches: [main]
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - lint
  - test
  - build

default:
  image: python:3.12-slim
  # nowszy pipeline na tej samej gałęzi przerywa starszy (concurrency: cancel-in-progress)
  interruptible: true
  timeout: 10 minutes

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Wspólne reguły: w merge requeście tylko przy zmianie części, na main zawsze.
.zmiany-python:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - healthcheck/**/*.py
          - healthcheck/*.toml
          - healthcheck/requirements*.txt
          - ci/.gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.narzedzia-python:
  before_script:
    - pip install -r healthcheck/requirements-dev.txt
  cache:
    key:
      files:
        - healthcheck/requirements-dev.txt
    paths:
      - .cache/pip

lint-python:
  stage: lint
  extends: [.zmiany-python, .narzedzia-python]
  script:
    - ruff check healthcheck

lint-yaml:
  stage: lint
  extends: .narzedzia-python
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - "**/*.yaml"
          - "**/*.yml"
          - .yamllint
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - yamllint .

lint-docker:
  stage: lint
  image:
    name: hadolint/hadolint:v2.15.1-debian
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - healthcheck/Dockerfile
          - healthcheck/.dockerignore
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - hadolint --no-color healthcheck/Dockerfile

testy:
  stage: test
  extends: [.zmiany-python, .narzedzia-python]
  image: python:${PYTHON}-slim
  parallel:
    matrix:
      - PYTHON: ["3.12", "3.13", "3.14"]
  script:
    - cd healthcheck
    - python -m pytest -v --junitxml=raport-testow.xml
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit: healthcheck/raport-testow.xml

chart:
  stage: test
  image:
    name: alpine/helm:4.3.0
    entrypoint: [""]
  needs: []
  variables:
    KUBECONFORM_WERSJA: v0.8.0
    KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    KUBERNETES_WERSJA: 1.37.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - chart/**/*
          - wdrozenia/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      wget -qO /tmp/kubeconform.tar.gz \
        "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_WERSJA}/kubeconform-linux-amd64.tar.gz"
      echo "${KUBECONFORM_SHA256}  /tmp/kubeconform.tar.gz" | sha256sum -c
      tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
    - |
      for srodowisko in dev prod; do
        helm lint --strict chart/status-strony -f "wdrozenia/$srodowisko/values.yaml"
        helm template "strona-$srodowisko" chart/status-strony -n "f2-$srodowisko" -f "wdrozenia/$srodowisko/values.yaml" \
          | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_WERSJA"
      done

obraz:
  stage: build
  image: docker:29
  services:
    - docker:29-dind
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        paths:
          - healthcheck/Dockerfile
          - healthcheck/.dockerignore
          - healthcheck/healthcheck.py
          - healthcheck/requirements.txt
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - docker build -t "healthcheck:$CI_COMMIT_SHORT_SHA" healthcheck
    - docker run --rm "healthcheck:$CI_COMMIT_SHORT_SHA" --help
